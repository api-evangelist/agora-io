  description: 'Search the Algolia index "agora_api_refAPIRefCrawler" across multiple query variations
    and return deduplicated hits with merged facets.


    About this index: Use this index to look up SDK methods, classes, parameters, callbacks, and usage
    details across Agora&amp;amp;#39;s real-time communication SDKs. &amp;amp;gt; Note: Signaling SDK
    API references are not in this index. Use `docs_platform_aware_markdown` with `facet_product: signaling`
    instead. &amp;amp;gt; Note: iOS and macOS are not in this index. Use `agora_swift_api_ref` instead.
    ## Available Products - `video-sdk` — Video calling SDK - `voice-sdk` — Voice calling SDK (shares
    most methods with video-sdk) - `chat-sdk` — Chat/messaging SDK - `interactive-whiteboard-sdk` — Whiteboard
    SDK - `server-gateway-sdk` — Server-side gateway SDK - `iot-sdk` — IoT SDK - `mediaplayer-kit` — Media
    player SDK - `flexible-classroom-sdk` — Classroom SDK ## Available Platforms `android`, `web`, `cpp`,
    `unity`, `electron`, `flutter`, `reactjs`, `react-native`, `unreal-engine`, `blueprint`, `windows-csharp`,
    `linux-cpp`, `linux-java`, `python`, `go` ## Versions - `4.x` — Video/Voice SDK - `6.x` — Flutter
    - `2.x` — React JS, Whiteboard - `1.x` — Chat SDK, IoT, MediaPlayer Kit ## Search Tips - Search by
    method name, class name, or feature description - Web SDK methods are on interfaces like `IAgoraRTCClient`,
    `ILocalAudioTrack` - React JS uses hooks and components: `useClientEvent`, `useRemoteUsers`, `AgoraRTCProvider`
    - Method overloads are indicated by `[1/3]`, `[2/3]` etc. in the `methodName` field - The `content`
    field is truncated at 5000 characters — use the `url` for the full page.


    Facet examples are not exhaustive. Use exact values observed in metadata or search results; use facet-value
    search when available. Never invent values or construct category paths. If no value is known for a
    positive filter, search the concept as query text first and refine using returned facets.


    Unsampled values are checked against the index. Facet validation errors stop the entire call before
    any result searches, even when partial results are enabled.


    Partial results: when at least one query succeeds and every failed query is rejected as invalid (HTTP
    400), the response includes partial: true and a failures array keyed by zero-based queryIndexes. Hits,
    nbHits, and facets then cover only the successful queries. Any other result-search failure returns
    bulk_search_failed for the entire tool call.'
